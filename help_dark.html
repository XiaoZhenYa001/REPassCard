<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>使用帮助（深色模式）</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --bg-color: #121212;
            --text-color: #e5e7eb;
            --card-bg: #1e1e1e;
            --border-radius: 12px;
            --border-color: #374151;
            --text-heading: #f9fafb;
            --text-muted: #9ca3af;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .header svg {
            margin-right: 16px;
            cursor: pointer;
            width: 24px;
            height: 24px;
        }

        .header h1 {
            font-size: 24px;
            margin: 0;
            color: var(--text-heading);
        }

        .search-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            margin-bottom: 24px;
            gap: 12px;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: var(--text-color);
            flex: 1;
            font-size: 16px;
            outline: none;
        }

        .search-box svg {
            color: var(--text-muted);
            width: 20px;
            height: 20px;
        }

        .help-group {
            margin-bottom: 24px;
        }

        .group-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 12px;
            margin-left: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .help-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .help-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .help-item:active {
            background-color: #2d3748;
        }

        .help-item:last-child {
            border-bottom: none;
        }

        .item-text {
            font-size: 16px;
            color: var(--text-heading);
        }

        .chevron svg {
            width: 20px;
            height: 20px;
            color: var(--text-muted);
        }

        .footer {
            margin-top: auto;
            text-align: center;
            padding: 24px 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        .contact-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="header">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        <h1>使用帮助</h1>
    </div>

    <div class="search-box">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        <input type="text" placeholder="搜索常见问题...">
    </div>

    <div class="help-group">
        <div class="group-title">新手入门</div>
        <div class="help-card">
            <div class="help-item">
                <div class="item-text">如何创建我的第一个密码？</div>
                <div class="chevron"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></div>
            </div>
            <div class="help-item">
                <div class="item-text">导入现有密码</div>
                <div class="chevron"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></div>
            </div>
        </div>
    </div>

    <div class="help-group">
        <div class="group-title">安全建议</div>
        <div class="help-card">
            <div class="help-item">
                <div class="item-text">什么是主密码？</div>
                <div class="chevron"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></div>
            </div>
            <div class="help-item">
                <div class="item-text">开启双重验证 (2FA)</div>
                <div class="chevron"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></div>
            </div>
        </div>
    </div>

    <div class="footer">
        <button class="contact-btn">联系客服</button>
        <p>工作时间：周一至周五 9:00 - 18:00</p>
    </div>
</body>
</html>
