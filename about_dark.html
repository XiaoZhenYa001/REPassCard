<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我们（深色模式）</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --bg-color: #121212;
            --text-color: #e5e7eb;
            --card-bg: #1e1e1e;
            --border-radius: 16px;
            --border-color: #374151;
            --text-heading: #f9fafb;
            --text-muted: #9ca3af;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            width: 100%;
            display: flex;
            align-items: center;
            margin-bottom: 40px;
        }

        .header svg {
            cursor: pointer;
            width: 24px;
            height: 24px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 8px 16px rgba(59, 130, 246, 0.2);
        }

        .logo-icon svg {
            width: 44px;
            height: 44px;
            color: white;
        }

        .app-name {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-heading);
            margin: 0;
        }

        .version {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .info-list {
            width: 100%;
            max-width: 400px;
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
            margin-bottom: 32px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            color: var(--text-muted);
        }

        .info-value {
            color: var(--text-heading);
            font-weight: 500;
        }

        .description {
            text-align: center;
            max-width: 320px;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: auto;
        }

        .copyright {
            padding: 24px 0;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
        }

        .social-links {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
        }

        .social-icon {
            width: 24px;
            height: 24px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="header">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
    </div>

    <div class="logo-container">
        <div class="logo-icon">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
        </div>
        <h2 class="app-name">PassCard 密码金库</h2>
        <div class="version">版本 1.0.0 (Build 20260419)</div>
    </div>

    <div class="info-list">
        <div class="info-item">
            <span class="info-label">官方网站</span>
            <span class="info-value">www.passcard.com</span>
        </div>
        <div class="info-item">
            <span class="info-label">微信公众号</span>
            <span class="info-value">PassCard安全实验室</span>
        </div>
        <div class="info-item">
            <span class="info-label">检查更新</span>
            <span class="info-value" style="color: var(--primary-color);">已是最新版本</span>
        </div>
    </div>

    <div class="description">
        PassCard 致力于为全球用户提供最安全的零知识密码管理方案。我们的使命是消除密码被窃风险，让数字生活更简单、更安全。
    </div>

    <div class="copyright">
        Copyright © 2024-2026 PassCard Inc. <br>
        All Rights Reserved.
    </div>
</body>
</html>
