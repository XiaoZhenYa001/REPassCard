<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加与编辑密码（深色模式）</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --bg-color: #121212;
            --text-color: #e5e7eb;
            --card-bg: #1e1e1e;
            --border-radius: 12px;
            --border-color: #374151;
            --text-heading: #f9fafb;
            --text-muted: #9ca3af;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 32px;
        }
        
        .header svg {
            margin-right: 16px;
            cursor: pointer;
        }

        .header h1 {
            font-size: 24px;
            margin: 0;
            color: var(--text-heading);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .form-group input,
        .form-group textarea {
            padding: 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 16px;
            color: var(--text-heading);
            outline: none;
            transition: border-color 0.2s;
        }
        
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 1px var(--primary-color);
        }

        .password-row {
            display: flex;
            gap: 12px;
        }

        .password-row input {
            flex: 1;
        }

        .icon-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            width: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-heading);
        }
        
        .btn-save {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 16px;
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: auto;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            margin-bottom: 24px;
        }

        .btn-save:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="header">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="28" height="28"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        <h1>新增账号记录</h1>
    </div>

    <form>
        <div class="form-group">
            <label>平台 / 网站名称</label>
            <input type="text" placeholder="例如：Google, Github..." />
        </div>

        <div class="form-group">
            <label>用户名 / 邮箱</label>
            <input type="text" placeholder="john.doe@example.com" />
        </div>

        <div class="form-group">
            <label>密码</label>
            <div class="password-row">
                <input type="password" value="secret12345" />
                <div class="icon-btn">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="20" height="20"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>备注 (可选)</label>
            <textarea rows="3" placeholder="工作专用，不含个人信息。"></textarea>
        </div>

        <button type="button" class="btn-save">安全保存加密数据</button>
    </form>
</body>
</html>
