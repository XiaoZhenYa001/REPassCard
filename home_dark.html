<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页概览（深色模式）</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --bg-color: #121212;
            --text-color: #e5e7eb;
            --card-bg: #1e1e1e;
            --border-radius: 16px;
            --border-color: #374151;
            --text-heading: #f9fafb;
            --text-muted: #9ca3af;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
        }

        .header {
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 28px;
            margin: 0;
            color: var(--text-heading);
        }

        .search-bar {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-heading);
            box-sizing: border-box;
            margin-bottom: 24px;
        }

        .stats-card {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            border-radius: var(--border-radius);
            padding: 24px;
            color: white;
            margin-bottom: 24px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        
        .stats-title {
            font-size: 14px;
            opacity: 0.9;
        }

        .stats-bold {
            font-size: 36px;
            font-weight: bold;
            margin-top: 8px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-heading);
        }

        .item-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item-card {
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        .item-icon {
            width: 40px;
            height: 40px;
            background-color: #2d3748;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            font-size: 20px;
        }

        .item-info h3 {
            margin: 0 0 4px 0;
            font-size: 16px;
            color: var(--text-heading);
        }

        .item-info p {
            margin: 0;
            font-size: 12px;
            color: var(--text-muted);
        }

        .fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            background-color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            color: white;
            font-size: 32px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>密码金库</h1>
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="28" height="28"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
    </div>

    <input type="text" class="search-bar" placeholder="搜索账号 / 标签..." />

    <div class="stats-card">
        <div class="stats-title">已保护资产总数</div>
        <div class="stats-bold">128</div>
    </div>

    <div class="section-title">最近访问</div>
    <div class="item-list">
        <div class="item-card">
            <div class="item-icon">G</div>
            <div class="item-info">
                <h3>Google Account</h3>
                <p>john.doe@gmail.com</p>
            </div>
        </div>
        <div class="item-card">
            <div class="item-icon" style="background:#1f2937">A</div>
            <div class="item-info">
                <h3>Apple ID</h3>
                <p>john.apple@icloud.com</p>
            </div>
        </div>
        <div class="item-card">
            <div class="item-icon" style="background:#374151">T</div>
            <div class="item-info">
                <h3>Twitter</h3>
                <p>@johndoe_99</p>
            </div>
        </div>
    </div>

    <div class="fab">+</div>
</body>
</html>
